# CI：push / PR 时自动执行 Lint → Typecheck → Test → Build
# pnpm 版本不写死，由 pnpm/action-setup 读取根 package.json 的 packageManager 字段（9.15.0）
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  verify:
    name: Lint / Typecheck / Test / Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Prisma client 类型需 generate 后才存在（本地已生成所以此前未暴露）
      - name: Generate Prisma client
        run: pnpm --filter @cex/db exec prisma generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # 说明：CI 只跑单元测试（不依赖 MySQL/Redis/Kafka）。
      # 集成测试（如账务 L2 test/ledger.integration.spec.ts）用 RUN_DB_TESTS=1 门控，本地起 cex-mysql 后运行；
      # 需要上 CI 时在 verify 下追加 services 段（mysql:8.4）并设该环境变量 —— 见 docs/项目生成说明.md §6。
